[project]
name = "locus"
version = "0.1.0"
description = "Reverse-geocode any lat/lon to Kenya's County, Constituency, Ward, Location, and Sub-Location — self-hosted, PostGIS-powered, no third-party API required."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.52.4",
] 

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a real PostGIS instance (deselect with '-m \"not integration\"')",
]
