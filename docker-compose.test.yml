# docker-compose.test.yml
# Isolated PostGIS instance for integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d
#        TEST_DATABASE_URL=postgresql://test_user:test_password@localhost:5433/test_db \
#            pytest tests/test_boundary_repository.py -m integration

services:
  postgres-test:
    image: postgis/postgis:16-3.4
    container_name: locus-postgres-test
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — faster, no leftover state
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 3s
      retries: 10
